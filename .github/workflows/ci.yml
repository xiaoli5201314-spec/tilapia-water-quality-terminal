name: Firmware and desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r desktop/requirements.txt
      - name: C host tests with address and undefined-behavior sanitizers
        run: sh firmware/tests/run_tests.sh
      - name: Desktop and firmware contract tests
        working-directory: desktop
        run: |
          python -m unittest discover -s tests -p test_control.py
          python -m unittest discover -s tests -p test_regressions.py
          python -m unittest discover -s tests -p test_firmware_contract.py
